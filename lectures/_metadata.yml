author: "Professor Luiz Carvalho - luizcarvalho@demec.ufmg.br"
institute: "Universidade Federal de Minas Gerais (UFMG)"

jupyter: python3

format:
  revealjs:
    theme: [default, ../../styles/custom.scss]

    slide-level: 2

    transition: slide
    background-transition: fade

    slide-number: true
    show-slide-number: all

    width: 1600
    height: 900

    smaller: false
    incremental: true
    auto-stretch: false

    code-line-numbers: true
    code-overflow: scroll

    footer: "Teoria das Estruturas Aeroespaciais II"

    embed-resources: true

navbar: false
sidebar: false

editor: source